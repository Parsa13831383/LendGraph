spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lendgraph
    username: ${DB_USERNAME:lendgraph}
    password: ${DB_PASSWORD:lendgraph}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false   # Enable once you add migrations under db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.lendgraph: INFO
    org.hibernate.SQL: DEBUG
